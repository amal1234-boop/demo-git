<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Cadence</title>
<link rel="stylesheet" href="styles/style.css">
<link rel="stylesheet" href="styles/auth.css">
</head>
<body class="auth-page">

<header class="auth-nav">
  <a class="brand" href="index.html" aria-label="Cadence, accueil">
    <svg class="logo-mark" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <path d="M9 18l4.5-6.5L17 15l6-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="landing-brand-title">Cadence</span>
  </a>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1>Content de te revoir</h1>
    <p class="auth-sub">Connecte-toi pour retrouver ton tableau de bord.</p>

    <p class="auth-error" id="formError" hidden></p>

    <form id="loginForm" class="auth-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required placeholder="toi@exemple.com">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn primary large">Me connecter</button>
    </form>

    <p class="auth-switch">Pas encore de compte ? <a href="inscription.html">Inscris-toi</a></p>
  </div>
</main>

<script>
const form = document.getElementById('loginForm');
const errorBox = document.getElementById('formError');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;

  const payload = {
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  };

  try {
    const res = await fetch('serveur/connexion.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Connexion impossible pour le moment.');
    window.location.href = 'app.php';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.hidden = false;
  }
});
</script>

</body>
</html>

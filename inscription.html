<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — Cadence</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

<header class="auth-nav">
  <a class="brand" href="index.html" aria-label="Cadence, accueil">
    <svg class="logo-mark" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <path d="M9 18l4.5-6.5L17 15l6-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="landing-brand-title">Cadence</span>
  </a>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1>Crée ton compte</h1>
    <p class="auth-sub">Gratuit, pensé pour ta réalité d'athlète.</p>

    <p class="auth-error" id="formError" hidden></p>

    <form id="registerForm" class="auth-form">
      <div class="field">
        <label for="name">Prénom (optionnel)</label>
        <input type="text" id="name" autocomplete="given-name" placeholder="Léa">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required placeholder="toi@exemple.com">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" autocomplete="new-password" required minlength="8" placeholder="8 caractères minimum">
      </div>
      <div class="field">
        <label for="passwordConfirm">Confirmer le mot de passe</label>
        <input type="password" id="passwordConfirm" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit" class="btn primary large">Je m'inscris</button>
    </form>

    <p class="auth-switch">Déjà un compte ? <a href="connexion.html">Connecte-toi</a></p>
  </div>
</main>

<script>
const form = document.getElementById('registerForm');
const errorBox = document.getElementById('formError');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;

  const password = document.getElementById('password').value;
  const passwordConfirm = document.getElementById('passwordConfirm').value;
  if (password !== passwordConfirm) {
    errorBox.textContent = 'Les mots de passe ne correspondent pas.';
    errorBox.hidden = false;
    return;
  }

  const payload = {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    password,
  };

  try {
    const res = await fetch('php/register.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Inscription impossible pour le moment.');
    window.location.href = 'app.php';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.hidden = false;
  }
});
</script>

</body>
</html>
